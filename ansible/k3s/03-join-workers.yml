---
- name: Join K3s workers (pure agents, no etcd)
  hosts: k3s_workers
  gather_facts: yes
  become: yes
  become_method: su
  serial: 1

  vars:
    k3s_user: k3su
    k3s_group: k3sg
    k3s_bin_dir: "/home/{{ k3s_user }}/k3s-bin"
    kubeconfig_path: "{{ k3s_bin_dir }}/k3s.yaml"
    first_server: "{{ groups['k3s_servers'][0] }}"

  tasks:
    # ----- FETCH TOKEN FROM FIRST SERVER -----
    - name: Fetch agent token from first server
      ansible.builtin.slurp:
        src: "/var/lib/rancher/k3s/server/agent-token"
      register: agent_token_b64
      delegate_to: "{{ first_server }}"
      vars:
        ansible_user: "{{ hostvars[first_server].ansible_user }}"
        ansible_ssh_pass: "{{ hostvars[first_server].ansible_ssh_pass }}"
        ansible_become_pass: "{{ hostvars[first_server].ansible_become_pass }}"
        ansible_become_method: "{{ hostvars[first_server].ansible_become_method }}"
      run_once: true
      ignore_errors: yes

    - name: Fallback to server token if agent token missing
      ansible.builtin.slurp:
        src: "/var/lib/rancher/k3s/server/token"
      register: server_token_b64
      delegate_to: "{{ first_server }}"
      vars:
        ansible_user: "{{ hostvars[first_server].ansible_user }}"
        ansible_ssh_pass: "{{ hostvars[first_server].ansible_ssh_pass }}"
        ansible_become_pass: "{{ hostvars[first_server].ansible_become_pass }}"
        ansible_become_method: "{{ hostvars[first_server].ansible_become_method }}"
      run_once: true
      when: agent_token_b64 is failed

    - name: Set token fact
      ansible.builtin.set_fact:
        k3s_token: "{{ (agent_token_b64.content | b64decode | trim) if agent_token_b64 is success else (server_token_b64.content | b64decode | trim) }}"

    # ----- GATHER FACTS FROM FIRST SERVER -----
    - name: Gather facts from first server (rpi5a)
      ansible.builtin.setup:
      delegate_to: "{{ first_server }}"
      delegate_facts: true
      run_once: true
      vars:
        ansible_user: "{{ hostvars[first_server].ansible_user }}"
        ansible_ssh_pass: "{{ hostvars[first_server].ansible_ssh_pass }}"
        ansible_become_pass: "{{ hostvars[first_server].ansible_become_pass }}"
        ansible_become_method: "{{ hostvars[first_server].ansible_become_method }}"

    # ----- GET FIRST SERVER IP -----
    - name: Get first server IP address
      ansible.builtin.set_fact:
        first_server_ip: "{{ hostvars[first_server]['ansible_default_ipv4'].address }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    # ----- ENSURE INSTALL SCRIPT IS PRESENT -----
    - name: Ensure bin directory exists
      ansible.builtin.file:
        path: "{{ k3s_bin_dir }}"
        state: directory
        owner: "{{ k3s_user }}"
        group: "{{ k3s_group }}"
        mode: "0755"

    - name: Check if install script exists
      ansible.builtin.stat:
        path: "{{ k3s_bin_dir }}/install.sh"
      register: install_script

    - name: Download install script if missing (fallback)
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: "{{ k3s_bin_dir }}/install.sh"
        mode: "0755"
        owner: "{{ k3s_user }}"
        group: "{{ k3s_group }}"
      when: not install_script.stat.exists

    # ----- JOIN CLUSTER AS WORKER -----
    - name: Join as worker using local install script
      environment:
        K3S_URL: "https://{{ hostvars['localhost']['first_server_ip'] }}:6443"
        K3S_TOKEN: "{{ k3s_token }}"
        INSTALL_K3S_EXEC: |
          agent
          --node-name={{ inventory_hostname }}
          --node-label=worker=true
      ansible.builtin.shell: |
        {{ k3s_bin_dir }}/install.sh
      become: yes
      become_user: root
