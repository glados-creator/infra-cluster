apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: private-
namespace: private

resources:
  # - middleware-auth-basic.yaml
  # - middleware-auth-trauth.yaml
  - middleware-auth-authentik.yaml
  # - redirect
  - glance
  - gatus
  - monitoring
  - code

secretGenerator:
  - name: auth-basic-secret
    envs:
    - secret.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true