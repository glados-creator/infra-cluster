apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: private
  labels:
    app: private-home-assistant
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`home-assistant.home.private.home`)
      middlewares:
        - name: private-middleware-auth-authentik
      services:
        - name: private-home-assistant-service
          port: 4404
  # tls: {}