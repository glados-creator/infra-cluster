apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: private
  labels:
    app: private-glance
spec:
  type: ClusterIP
  selector:
    app: private-glance
  ports:
    - name: web
      protocol: TCP
      port: 4400 # port of that service
      targetPort: 8080 # port of the container
