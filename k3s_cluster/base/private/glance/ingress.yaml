apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: private
  labels:
    app: private-glance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`glance.private.home`)
      middlewares:
       - name: private-middleware-basic-auth
      services:
        - name: glance-service
          port: 4400
  #tls: {} 