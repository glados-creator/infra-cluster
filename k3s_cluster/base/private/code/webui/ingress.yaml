apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: private
  labels:
    app: private-webui
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`webui.code.private.home`)
      middlewares:
       - name: private-middleware-basic-auth
      services:
        - name: webui-service-dashboard
          port: 4425
  #tls: {} 