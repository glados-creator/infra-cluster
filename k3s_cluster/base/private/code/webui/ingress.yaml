apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: private
  labels:
    app: private-code-webui
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`webui.code.private.home`)
      # middlewares:
      #   - name: private-middleware-auth-authentik
      services:
        - name: private-code-webui-service
          port: 4434
          # tls: {}
