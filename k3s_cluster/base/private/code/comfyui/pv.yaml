apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv
  namespace: private
  labels:
    app: private-comfyui
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 192.168.1.24
    path: /bhole/cluster/private/code/comfyui/