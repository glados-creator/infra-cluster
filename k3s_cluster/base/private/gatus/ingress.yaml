apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: private
  labels:
    app: private-gatus
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`gatus.private.home`)
      # middlewares:
      #  - name: private-middleware-auth-authentik
      services:
        - name: private-gatus-service
          port: 4401
          #tls: {} 
