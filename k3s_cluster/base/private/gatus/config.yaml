storage:
  type: sqlite
  path: /data/data.db

metrics: true

endpoints:
  # Currently deployed services
  - name: glance-private
    url: "http://private-glance-service.private.svc.cluster.local:4400"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  - name: gatus-private
    url: "http://private-gatus-service.private.svc.cluster.local:4401"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  - name: dozzle-private
    url: "http://private-dozzle-service.private.svc.cluster.local:4415"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

