apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: private
  labels:
    app: private-monitor-headlamp
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`headlamp.monitoring.private.home`)
      # middlewares:
      #   - name: private-middleware-auth-authentik
      services:
        - name: private-monitor-headlamp-service
          port: 4420
  # tls: {}