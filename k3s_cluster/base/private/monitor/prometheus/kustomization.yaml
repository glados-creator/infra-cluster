apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: prometheus-
namespace: private
resources:
  - pvc.yaml
  - pv.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - service-account.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yaml
