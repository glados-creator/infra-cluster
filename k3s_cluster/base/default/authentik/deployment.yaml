apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: default
  labels:
    app: main-authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-authentik
  template:
    metadata:
      labels:
        app: main-authentik
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10

      securityContext:
        fsGroup: 999
      containers:
        # --- Authentik Server ---
        - name: authentik-server
          image: ghcr.io/goauthentik/server:latest
          args: ["server"]
          ports:
            - containerPort: 9000   # HTTP
            - containerPort: 9443   # HTTPS
          envFrom:
            - configMapRef:
                name: authentik-config
            - secretRef:
                name: authentik-secret
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /custom-templates
              subPath: custom-templates
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5

        # --- Authentik Worker ---
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:latest
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: authentik-config
            - secretRef:
                name: authentik-secret
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /certs
              subPath: certs
            - name: data
              mountPath: /custom-templates
              subPath: custom-templates

        # --- PostgreSQL sidecar ---
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: authentik-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
              subPath: pgdata
          # Health check for PostgreSQL
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - authentik
            initialDelaySeconds: 5
            periodSeconds: 2

        # --- Redis sidecar ---
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 2

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc