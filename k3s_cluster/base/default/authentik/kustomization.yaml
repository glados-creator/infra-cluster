apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: authentik-
namespace: default

resources:
  - pv.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: authentik-config
    envs:
      - config.env

secretGenerator:
  - name: authentik-secret
    envs:
      - secret.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true