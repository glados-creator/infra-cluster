apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: set-real-ip
spec:
  headers:
    # Explicitly set X-Real-IP to the actual client IP
    customRequestHeaders:
      X-Real-IP: "{clientIP}" 
      # Also forward the full chain for completeness (Technitium prefers X-Real-IP, but supports XFF)
      X-Forwarded-For: "{clientIP}" 