apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: <app-name>-
namespace: <app-ns>
resources:
  - service-account.yaml
  - pvc.yaml
  - pv.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: glance-config
    files:
      - glance.yml=config.yaml
secretGenerator:
  - name: youtarr-secret
    envs:
      - secret.env
    type: Opaque
