apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: main-
namespace: default

resources:
  - middleware-auth-basic.yaml
  - middleware-auth-trauth.yaml
  - middleware-auth-authentik.yaml
  - traefik
  - technitium
  - authentik
  - glance
  - gatus
  - dozzle

secretGenerator:
  - name: main-auth-basic-secret
    envs:
    - secret.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true