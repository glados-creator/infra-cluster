apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: default
  labels:
    app: main-netboot
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`netboot.default.home`)
      # middlewares:
      #   - name: main-middleware-auth-authentik
      services:
        - name: main-netboot-service
          port: 2203
