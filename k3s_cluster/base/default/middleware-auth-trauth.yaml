apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: middleware-auth-trauth
  namespace: default
spec:
  plugin:
    trauth:
      domain: ".main.home"
      # cookiename: "trauth_cookie"
      # cookiepath: "/"
      # cookiesecure: false   # set true if using HTTPS
      # cookiehttponly: true
      usersfile: "/etc/trauth-main/auth"