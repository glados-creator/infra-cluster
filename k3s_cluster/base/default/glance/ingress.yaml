apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: default
  labels:
    app: main-glance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`glance.main.home`)
      middlewares:
       - name: main-middleware-auth-trauth # authentik
      services:
        - name: main-glance-service
          port: 2200
  #tls: {} 