apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: <app-ns>
  labels:
    app: <app-ns>-<app-name>
spec:
  replicas: 2
  selector:
    matchLabels:
      app: <app-ns>-<app-name>
  template:
    metadata:
      labels:
        app: <app-ns>-<app-name>
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      serviceAccountName: serviceaccount
      # runtimeClassName: nvidia
      containers:
        - name: <app-name>
          image: <app-URL>:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: youtarr-config
            - secretRef:
                name: youtarr-secret
          ports:
          - containerPort: 53
            protocol: UDP
          - containerPort: 80
          - containerPort: 443
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
                - NET_ADMIN
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              # nvidia.com/gpu-all: 1
            limits:
              cpu: 2
              memory: 4Gi
              # nvidia.com/gpu-all: 1
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
