apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv
  namespace: public
  labels:
    app: public-<app-name>
spec:
  capacity:
    storage: <app-cap>Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # cephfs
  # mountOptions:
  #   - nolock
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph
    volumeHandle: cephfs-vicus-public-<app-name>
    volumeAttributes:
      clusterID: rook-ceph   
      fsName: bhole
      staticVolume: "true"
      rootPath: /volumes/k8s-colosseum/vicus-public/30251adb-9178-40ba-81b3-465cdc0f5ea6/<app-name>/
