apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv
  namespace: public
  labels:
    app: public-<app-name>
spec:
  capacity:
    storage: <app-cap>Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # cephfs
  # mountOptions:
  #   - nolock
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph
    volumeHandle: cephfs-vicus-public-<app-name>
    volumeAttributes:
      clusterID: rook-ceph
      fsName: bhole
      staticVolume: "true"
      rootPath: /volumes/colosseum/vicus-public/0213e1d8-87b6-43b0-a9be-d22436afb88a/<app-name>/
