apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: <app-name>-
namespace: <app-ns>
resources:
  - sa.yaml
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - pvc-cephfs.yaml
  - pv-cephfs.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # - scaler.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: glance-config
    files:
      - glance.yml=config.yaml
secretGenerator:
  - name: youtarr-secret
    envs:
      - secret.env
    type: Opaque
