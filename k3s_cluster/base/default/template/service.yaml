apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: <app-ns>
  labels:
    app: <app-ns>-<app-name>
  annotations:
    metallb.io/address-pool: internal-ips
    # metallb.io/loadBalancerIPs: 192.168.1.1
spec:
  type: LoadBalancer
  selector:
    app: <app-ns>-<app-name>
  # loadBalancerIP: 192.168.1.1
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 6680
      
    - name: websecure
      protocol: TCP
      port: 443
      targetPort: 6643
  # externalTrafficPolicy: Local

---
apiVersion: v1
kind: Service
metadata:
  name: service-dashboard
  namespace: <app-ns>
  labels:
    app: <app-ns>-<app-name>
spec:
  type: ClusterIP
  selector:
    app: <app-ns>-<app-name>
  ports:
    - protocol: TCP
      name: dashboard
      port: 8080
      targetPort: 6680
    - protocol: TCP
      name: metrics
      port: 8082
      targetPort: 6682