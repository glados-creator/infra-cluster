apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: default
  labels:
    app: main-traefik
spec:
  type: LoadBalancer
  selector:
    app: main-traefik
  ports:
    - protocol: TCP
      port: 80
      name: web
      targetPort: 80
    - protocol: TCP
      port: 443
      name: websecure
      targetPort: 443

---
apiVersion: v1
kind: Service
metadata:
  name: service-dashboard
  namespace: default
  labels:
    app: main-traefik
spec:
  type: ClusterIP
  selector:
    app: main-traefik
  ports:
    - protocol: TCP
      name: dashboard
      port: 8080
      targetPort: 2280
    - protocol: TCP
      name: metrics
      port: 8082
      targetPort: 2282