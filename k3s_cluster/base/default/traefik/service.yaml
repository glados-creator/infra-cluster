apiVersion: v1
kind: Service
metadata:
  name: service-incoming
  namespace: default
  labels:
    app: main-traefik
  annotations:
    metallb.io/address-pool: public-ips
    metallb.io/loadBalancerIPs: 192.168.1.2
spec:
  type: LoadBalancer
  selector:
    app: main-traefik
  ports:
    - protocol: TCP
      port: 80
      name: web-incoming
      targetPort: 80
    - protocol: TCP
      port: 443
      name: websecure-incoming
      targetPort: 443

---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: default
  labels:
    app: main-traefik
spec:
  type: ClusterIP
  selector:
    app: main-traefik
  ports:
    - name: web
      protocol: TCP
      port: 2280
      targetPort: 8080 
    - name: metrics
      protocol: TCP
      port: 2282
      targetPort: 8082