apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: default
  labels:
    app: main-openwrt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-openwrt
  template:
    metadata:
      labels:
        app: main-openwrt
      annotations:
        # Multus network attachments
        k8s.v1.cni.cncf.io/networks: |
          [
            { "name": "main-openwrt-internal-net", "interface": "eth1", "ips": ["172.16.0.1/24"] },
            { "name": "main-openwrt-isp-net", "interface": "eth2", "ips": ["192.168.1.252/24"], "gateway": ["192.168.1.254"] },
            { "name": "main-openwrt-vpn-net", "interface": "eth3", "ips": ["172.16.99.1/24"] }
          ]
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      nodeSelector:
        server: "true"
      serviceAccountName: serviceaccount
      containers:
        - name: openwrt
          image: openwrt/rootfs:latest
          imagePullPolicy: IfNotPresent
          # restartPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 443
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                # volumeMounts:
                #   - name: data
                #     mountPath: /etc         # persist OpenWrt config
                # readinessProbe:
                #   httpGet:
                #     path: /
                #     port: 80
                #   initialDelaySeconds: 5
                #   periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
