apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: isp-net
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "isp-net",
      "type": "ipvlan",
      "master": "eth0",
      "mode": "l2",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.1.252/24",
            "gateway": "192.168.1.254"
          }
        ]
      }
    }
---
