apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: default
  labels:
    app: main-node-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ClusterIP
  clusterIP: None   # headless – gives one endpoint per pod
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  selector:
    app: main-node-exporter