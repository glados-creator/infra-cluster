apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: default
  labels:
    app: main-gatus
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`gatus.main.home`)
      # middlewares:
      #  - name: main-middleware-auth-authentik
      services:
        - name: main-gatus-service
          port: 2201
  tls:
    secretName: home-wildcard-tls-secret
