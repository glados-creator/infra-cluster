# 1. SERVER - Defines what we're protecting
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: server
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: main-dozzle
  port: 8080
  proxyProtocol: HTTP/1
---
# 2. MESHTLSAUTHENTICATION - Defines how clients authenticate
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: identity
  namespace: default
spec:
  identities:
    - main-treafik-sa.default.sa.identity.linkerd.cluster.local
---
# 3. AUTHORIZATIONPOLICY - Binds it all together
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: auth
  namespace: default
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: server
  requiredAuthenticationRefs:
    - name: identity
      kind: MeshTLSAuthentication
      group: policy.linkerd.io