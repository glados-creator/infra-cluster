# 1. SERVER - Defines what we're protecting (Nginx port 80)[reference:2]
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: server
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: main-dozzle
  port: 8080
  proxyProtocol: HTTP/1.1
---
# 2. MESHTLSAUTHENTICATION - Defines how clients authenticate[reference:3]
apiVersion: policy.linkerd.io/v1beta1
kind: MeshTLSAuthentication
metadata:
  name: identity
  namespace: default
spec:
  identities:
    - main-treafik-sa.default.sa.identity.linkerd.cluster.local
---
# 3. AUTHORIZATIONPOLICY - Binds it all together: ONLY python-sa can access Nginx[reference:4]
apiVersion: policy.linkerd.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: auth
  namespace: default
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: main-treafik-server
  requiredAuthenticationRefs:
    - name: main-dozzle-identity
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
