apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset
  namespace: default
spec:
  selector:
    matchLabels:
      app: main-harbor
  template:
    metadata:
      labels:
        app: main-harbor
    spec:
      serviceAccountName: serviceaccount
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1-debian-syslog
          imagePullPolicy: IfNotPresent
          # restartPolicy: Always
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              value: dummy # not used; we forward to syslog
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluentd-config
