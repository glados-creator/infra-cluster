apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: default
  labels:
    app: main-harbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-harbor
  template:
    metadata:
      labels:
        app: main-harbor
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10

      serviceAccountName: serviceaccount

      containers:
        # ---------- core ----------
        - name: core
          image: goharbor/harbor-core:latest
          ports:
            - containerPort: 8080
            - containerPort: 8443
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: core-data
            - name: data
              mountPath: /etc/core/ca
              subPath: ca_download
            - name: core-config
              mountPath: /etc/core/app.conf
              subPath: app.conf
            - name: core-private-key
              mountPath: /etc/core/private_key.pem
              subPath: private_key.pem
            - name: core-secretkey
              mountPath: /etc/core/key
              subPath: secretkey
            - name: trust-certs
              mountPath: /harbor_cust_cert

        # ---------- registry ----------
        - name: registry
          image: goharbor/registry-photon:latest
          ports:
            - containerPort: 5000
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /storage
              subPath: registry
            - name: registry-config
              mountPath: /etc/registry
            - name: registry-root-crt
              mountPath: /etc/registry/root.crt
              subPath: root.crt
            - name: trust-certs
              mountPath: /harbor_cust_cert

        # ---------- registryctl ----------
        - name: registryctl
          image: goharbor/harbor-registryctl:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /storage
              subPath: registry
            - name: registry-config
              mountPath: /etc/registry
            - name: registryctl-config
              mountPath: /etc/registryctl/config.yml
              subPath: config.yml
            - name: trust-certs
              mountPath: /harbor_cust_cert

        # ---------- portal (web console, static files only) ----------
        - name: portal
          image: goharbor/harbor-portal:latest
          ports:
            - containerPort: 8090
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: portal-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

        # ---------- jobservice ----------
        - name: jobservice
          image: goharbor/harbor-jobservice:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /var/log/jobs
              subPath: job_logs
            - name: jobservice-config
              mountPath: /etc/jobservice/config.yml
              subPath: config.yml
            - name: trust-certs
              mountPath: /harbor_cust_cert

        # ---------- trivy-adapter ----------
        - name: trivy-adapter
          image: goharbor/trivy-adapter-photon:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /home/scanner/.cache/trivy
              subPath: trivy-adapter/trivy
            - name: data
              mountPath: /home/scanner/.cache/reports
              subPath: trivy-adapter/reports
            - name: trust-certs
              mountPath: /harbor_cust_cert

        # ---------- log ----------
        - name: log
          image: goharbor/harbor-log:latest
          ports:
            - containerPort: 1514
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /var/log/docker
              subPath: logs
            - name: log-config
              mountPath: /etc/logrotate.d/logrotate.conf
              subPath: logrotate.conf
            - name: log-config
              mountPath: /etc/rsyslog.d/rsyslog_docker.conf
              subPath: rsyslog_docker.conf

        # ---------- exporter ----------
        - name: exporter
          image: goharbor/harbor-exporter:latest
          # Default listen port is 8001 — doesn't collide with anything
          # else in this pod, left unset. Verify in the container logs.
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: trust-certs
              mountPath: /harbor_cust_cert

        # ---------- postgresql ----------
        - name: postgresql
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 2

        # ---------- redis ----------
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
          securityContext:
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE          
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis
              subPath: redis
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 2

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: log-config
          configMap:
            name: harbor-log-config
        - name: registry-config
          configMap:
            name: harbor-registry-config
        - name: registryctl-config
          configMap:
            name: harbor-registryctl-config
        - name: core-config
          configMap:
            name: harbor-core-config
        - name: portal-config
          configMap:
            name: harbor-portal-config
        - name: jobservice-config
          configMap:
            name: harbor-jobservice-config
        - name: trust-certs
          configMap:
            name: harbor-trust-certs
        - name: registry-root-crt
          secret:
            secretName: harbor-registry-root-crt
        - name: core-private-key
          secret:
            secretName: harbor-core-private-key
        - name: core-secretkey
          secret:
            secretName: harbor-core-secretkey
