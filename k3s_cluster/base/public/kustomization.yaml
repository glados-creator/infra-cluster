apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: public-

resources:
  - middleware-basic-auth.yaml
  # - middleware-auth-sso.yaml
  # - redirect
  - glance
  - gatus

secretGenerator:
  - name: basic-auth-secret
    envs:
    - secret.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true