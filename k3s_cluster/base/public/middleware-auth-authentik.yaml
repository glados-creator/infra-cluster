apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name:  public-middleware-auth-authentik
  namespace: public
spec:
  forwardAuth:
    address: http://authentik.default.svc.cluster.local:2280/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-email
      - X-authentik-name
      - X-authentik-groups