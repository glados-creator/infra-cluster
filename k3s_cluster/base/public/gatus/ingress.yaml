apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: public
  labels:
    app: public-gatus
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`gatus.public.home`)
      middlewares:
       - name: public-middleware-auth-authentik
      services:
        - name: public-gatus-service
          port: 9901
  #tls: {} 