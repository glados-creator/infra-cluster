apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: dmz
  labels:
    app: dmz-frontalt-invidious
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # invidious-companion: serves video/caption streams directly to the
    # client's browser, so it needs its own public route. No auth
    # middleware here - the browser hits this directly, not through a login.
    - kind: Rule
      match: Host(`invidious.alt.dmz.home`) && PathPrefix(`/companion`)
      services:
        - name: dmz-frontalt-invidious-service
          port: 6626
    - kind: Rule
      match: Host(`invidious.alt.dmz.home`) && !PathPrefix(`/companion`)
      # middlewares:
      #   - name: dmz-middleware-auth-authentik
      services:
        - name: dmz-frontalt-invidious-service
          port: 6625
          #tls: {}
