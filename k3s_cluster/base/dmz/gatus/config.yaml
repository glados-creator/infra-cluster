storage:
  type: sqlite
  path: /data/data.db

metrics: true

endpoints:
  # DMZ core services
  - name: glance-dmz
    url: "http://dmz-glance-service.dmz.svc.cluster.local:6600"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  - name: gatus-dmz
    url: "http://dmz-gatus-service.dmz.svc.cluster.local:6601"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  # Media services (all use svc ports from your table)
  - name: jellyfin
    url: "http://dmz-media-jellyfin-service.dmz.svc.cluster.local:6650"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

