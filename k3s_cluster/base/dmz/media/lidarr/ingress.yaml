apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: dmz
  labels:
    app: dmz-media-lidarr
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`lidarr.media.dmz.home`)
      middlewares:
        - name: dmz-media-middleware-auth-trauth # authentik
      services:
        - name: dmz-media-lidarr-service
          port: 6656
  #tls: {} 