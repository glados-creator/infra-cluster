apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: dmz
  labels:
    app: dmz-media-radarr
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`radarr.media.dmz.home`)
      middlewares:
        - name: dmz-media-middleware-auth-authentik
      services:
        - name: dmz-media-radarr-service
          port: 6654
  #tls: {} 