apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-pv
  namespace: dmz
  labels:
    app: dmz-media
spec:
  capacity:
    storage: 250Gi          # can be larger than PVC request
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
    # - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 192.168.1.24  # your NFS server IP
    path: /bhole/cluster/dmz/media-stack/ # your NFS export path