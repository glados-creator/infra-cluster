apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: youtarr-
namespace: dmz

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: youtarr-config
    envs:
      - config.env

secretGenerator:
  - name: youtarr-secret
    envs:
      - secret.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true