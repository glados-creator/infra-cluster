apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-web
  namespace: dmz
  labels:
    app: dmz-media-jellyfin
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`jellyfin.media.dmz.home`)
      #middlewares:
      #  - name: dmz-media-middleware-auth-sso
      services:
        - name: dmz-media-jellyfin-service
          port: 6650
  #tls: {}
---
apiVersion: traefik.io/v1alpha1
