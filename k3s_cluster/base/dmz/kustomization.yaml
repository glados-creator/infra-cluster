apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: dmz-
namespace: dmz
resources:
  - middleware
  - glance
  - gatus
  - media
  - oss
  - alternative-frontends
  - cloud
  - game
secretGenerator:
  - name: auth-basic-secret
    envs:
      - secret.env
    type: Opaque
generatorOptions:
  disableNameSuffixHash: true
