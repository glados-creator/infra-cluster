apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: dmz-
namespace: dmz

resources:
  # - middleware-auth-basic.yaml
  # - middleware-auth-trauth.yaml
  - middleware-auth-authentik.yaml
  # - redirect
  - glance
  - gatus
  - media
  # - docker-registry

secretGenerator:
  - name: auth-basic-secret
    envs:
    - secret.env
    type: Opaque

generatorOptions:
  disableNameSuffixHash: true