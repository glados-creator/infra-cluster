apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: dmz
  labels:
    app: dmz-glance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`glance.dmz.home`)
      middlewares:
       - name: dmz-middleware-basic-auth
      services:
        - name: glance-service-dashboard
          port: 6600
  #tls: {} 