apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute
  namespace: dmz
  labels:
    app: dmz-glance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`glance.dmz.home`)
      middlewares:
        - name: prod-dmz/dmz-middleware-auth-basic
      services:
        - name: dmz-glance-service
          port: 6600
          #tls: {} 
