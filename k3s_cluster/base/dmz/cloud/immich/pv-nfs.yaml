apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv
  namespace: dmz
  labels:
    app: dmz-cloud-immich
spec:
  capacity:
    # this backs the photo/video library, not just app config - size generously
    storage: 128Gi
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
    # - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  # mountOptions:
  #   - nolock
  nfs:
    server: 192.168.1.24 # your NFS server IP
    path: /bhole/cluster/dmz/cloud/immich/ # your NFS export path
