apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv
  namespace: dmz
  labels:
    app: dmz-cloud-immich
spec:
  capacity:
    # this backs the photo/video library, not just app config - size generously
    storage: 128Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # cephfs
  # mountOptions:
  #   - nolock
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph
    volumeHandle: cephfs-vicus-dmz
    volumeAttributes:
      clusterID: rook-ceph   
      fsName: bhole
      staticVolume: "true"
      rootPath: /volumes/k8s-colosseum/vicus-dmz/8496c355-8ebf-4b44-836e-3bbbf7c1d88d/cloud/immich/
