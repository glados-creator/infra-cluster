apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: immich-
namespace: dmz
resources:
  - sa.yaml
  - pvc-cephfs.yaml
  - pv-cephfs.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: immich-config
    envs:
      - config.env
secretGenerator:
  - name: immich-secret
    envs:
      - secret.env
    type: Opaque
