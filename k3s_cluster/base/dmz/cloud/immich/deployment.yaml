apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: dmz
  labels:
    app: dmz-cloud-immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dmz-cloud-immich
  template:
    metadata:
      labels:
        app: dmz-cloud-immich
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10

      serviceAccountName: serviceaccount
      # Ensure PostgreSQL user (uid 999) can write to PVC
      securityContext:
        fsGroup: 999

      initContainers:
        # ---------- postgres (immich's fork w/ vector search extension) ----------
        - name: postgres
          # must be immich-app's own postgres image (has vectorchord/pgvecto.rs
          # baked in) - plain postgres:alpine will NOT work here. Check
          # https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
          # for the tag that matches the immich-server version below.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always # sidecar
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          securityContext:
            capabilities:
              add:
                - CHOWN
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(DB_USERNAME)
                - -d
                - $(DB_DATABASE_NAME)
            initialDelaySeconds: 5
            periodSeconds: 2

        # ---------- valkey / valkey ----------
        - name: valkey
          image: valkey/valkey:alpine
          imagePullPolicy: IfNotPresent
          restartPolicy: Always # sidecar
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10

        # ---------- machine learning (facial recognition, smart search) ----------
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:release
          imagePullPolicy: IfNotPresent
          restartPolicy: Always # sidecar
          ports:
            - containerPort: 3003
          volumeMounts:
            - name: data
              mountPath: /cache
              subPath: ml-cache
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi

      containers:
        # ---------- immich-server (web UI + API, this is what clients hit) ----------
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          ports:
            - containerPort: 2283
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: library
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
