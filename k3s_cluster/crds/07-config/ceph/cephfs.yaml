apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: bholefs
  namespace: rook-ceph
spec:
  metadataPool:
   # - name: bhole_metadata ?
    replicated:
      size: 3
    # deviceClass: ssd
  dataPools:
    - name: bhole_data
      failureDomain: host
      replicated:
        size: 3
      # deviceClass: hdd
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
---
# static alloc
apiVersion: ceph.rook.io/v1
kind: CephFilesystemSubVolumeGroup
metadata:
  name: colosseum
  namespace: rook-ceph
spec:
  filesystemName: bholefs
---
# dynamic alloc cephsc
apiVersion: ceph.rook.io/v1
kind: CephFilesystemSubVolumeGroup
metadata:
  name: kairos
  namespace: rook-ceph
spec:
  filesystemName: bholefs

