spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "bridge",
    "bridge": "test-br0",
    "isDefaultGateway": false,
    "ipam": {
      "type": "host-local",
      "subnet": "192.168.1.0/24"
    }
  }'
