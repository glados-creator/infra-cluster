# List all VMs	kubectl get vms
# List running VM instances (VMI)	kubectl get vmis
# View VM details	kubectl describe vm ubuntu-vm
# View VMI details	kubectl describe vmi ubuntu-vm
# Delete a VM	kubectl delete vm ubuntu-vm
# Start a VM (set running=true)	kubectl patch vm ubuntu-vm -n default --type merge -p '{"spec":{"runStrategy":"Always"}}'
# Stop a VM (set running=false)	kubectl patch vm ubuntu-vm -n default --type merge -p '{"spec":{"runStrategy":"Halted"}}'
# Check VM logs	kubectl logs <virt-launcher-pod-name>
# virtctl console ubuntu-vm -n default
# virtctl vnc ubuntu-vm -n default

# RAW SSH
# kubectl exec -it -n default $(kubectl get vmi ubuntu-vm -n default -o jsonpath='{.status.interfaces[0].name}' 2>/dev/null || echo "") -- true 2>/dev/null
# VIRTCTL
# VERSION=$(kubectl get kubevirt.kubevirt.io/kubevirt -n kubevirt -o jsonpath='{.status.observedKubeVirtVersion}' 2>/dev/null || echo "v1.0.0")
# ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
# curl -L -o virtctl https://github.com/kubevirt/kubevirt/releases/download/${VERSION}/virtctl-${VERSION}-linux-${ARCH}
# chmod +x virtctl
# sudo mv virtctl /usr/local/bin/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubuntu-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Gi
  storageClassName: bholesc # Your CephFS StorageClass
---
apiVersion: v1
kind: Pod
metadata:
  name: iso-loader
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: alpine:3.20
      command: ["sh", "-c"]
      args:
        - |
          apk add --no-cache curl
          curl -L -o /iso/ubuntu.iso https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img
      volumeMounts:
        - name: iso
          mountPath: /iso
  volumes:
    - name: iso
      persistentVolumeClaim:
        claimName: ubuntu-pvc
