---
# 2. The VirtualMachine that uses the imported image
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-vm
  namespace: default
spec:
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/domain: ubuntu-vm
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: cdrom
              cdrom:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: cdrom
          persistentVolumeClaim:
            claimName: ubuntu-pvc
