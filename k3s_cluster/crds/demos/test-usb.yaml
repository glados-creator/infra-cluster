
apiVersion: v1
kind: Pod
metadata:
  name: alpine-usb-minimal
  labels:
    app: alpine-usb
spec:
  # nodeSelector:
  #   kubernetes.io/hostname: stitan
  containers:
    - name: alpine
      image: alpine:latest
      command:
        - /bin/sh
        - -c
        - |
          while [ ! -e /dev/sandisk ]; do sleep 1; done
          mkdir -p /usb
          mount -t vfat /dev/sandisk /usb 2>/dev/null || \
          mount -t ext4 /dev/sandisk /usb 2>/dev/null || \
          mount -t ntfs-3g /dev/sandisk /usb 2>/dev/null || \
          echo "Mount failed"
          tail -f /dev/null
      securityContext:
        capabilities:
          add:
            - SYS_ADMIN
          # Also need to mount /dev as a volume if we use SYS_ADMIN? No, the device is injected by the plugin.
      resources:
        requests:
          squat.ai/sandisk: "1"
        limits:
          squat.ai/sandisk: "1"
      volumeMounts:
        - name: usb-mount
          mountPath: /usb
  volumes:
    - name: usb-mount
      emptyDir: {}
