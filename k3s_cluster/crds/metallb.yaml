apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-ips
  namespace: metallb-system
spec:
  addresses:
  - 172.16.0.1-172.16.0.9
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal-ips
  namespace: metallb-system
spec:
  addresses:
  - 192.168.1.252-192.168.1.252
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: public-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - public-ips
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: internal-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - internal-ips