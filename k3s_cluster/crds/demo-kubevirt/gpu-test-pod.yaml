apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: default   # or your preferred namespace
spec:
  containers:
  - name: ubuntu-gpu
    image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    command: ["/bin/bash", "-c"]
    args:
      - |
        echo "GPU test pod started."
        nvidia-smi
        echo "Sleeping forever. To test GPU inside, exec into this pod."
        sleep 3600
    resources:
      limits:
        nvidia.com/gpu-all: 1   # This requests one virtual GPU (since you have replicas:4, it's 1/4 of the physical card)
  restartPolicy: Never